<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FQC · Sleep & Eye Direction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --panel2: #182338;
      --line: #243049;
      --text: #e8eef9;
      --muted: #8fa0bc;
      --ok: #2fbf71;
      --warn: #f0a202;
      --danger: #e63946;
      --accent: #4cc9f0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2744 0%, var(--bg) 55%);
      color: var(--text);
    }
    .app { display: flex; flex-direction: column; height: 100%; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid var(--line);
      background: rgba(10, 16, 28, 0.85); backdrop-filter: blur(8px);
    }
    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.02em; }
    .brand span { color: var(--muted); font-size: 12px; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px; background: var(--panel2);
      border: 1px solid var(--line); font-size: 12px; font-weight: 600;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
    .dot.on { background: var(--ok); box-shadow: 0 0 10px rgba(47,191,113,.7); }
    .stats {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
      padding: 12px 20px;
    }
    .stat {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px;
    }
    .stat label { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .stat strong { display: block; margin-top: 4px; font-size: 22px; font-family: "IBM Plex Mono", monospace; }
    .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 340px; gap: 12px; padding: 0 20px 20px; }
    .video-card, .side {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel2);
    }
    select, button {
      font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    .toggle {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    }
    .feed {
      flex: 1; min-height: 0; background: #05080f; display: grid; place-items: center;
    }
    .feed img { width: 100%; height: 100%; object-fit: contain; }
    .metrics {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      padding: 10px 12px; border-top: 1px solid var(--line);
      font-family: "IBM Plex Mono", monospace; font-size: 12px;
    }
    .metrics div { background: #0d1524; border-radius: 8px; padding: 8px 10px; }
    .metrics span { color: var(--muted); display: block; font-size: 10px; margin-bottom: 2px; font-family: "IBM Plex Sans", sans-serif; }
    .side-head {
      padding: 12px 14px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center;
    }
    .side-head h2 { margin: 0; font-size: 14px; }
    .alerts { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .alert {
      background: #0d1524; border: 1px solid var(--line); border-radius: 10px;
      padding: 10px; display: grid; grid-template-columns: 64px 1fr; gap: 10px;
    }
    .alert img { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; background: #000; }
    .alert .meta { font-size: 12px; }
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 700;
    }
    .Critical { background: rgba(230,57,70,.2); color: #ff7b86; }
    .High { background: rgba(240,162,2,.18); color: #ffc857; }
    .Medium { background: rgba(76,201,240,.15); color: #7ad9f7; }
    .empty { color: var(--muted); text-align: center; padding: 40px 12px; font-size: 13px; }
    @media (max-width: 980px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .main { grid-template-columns: 1fr; }
      .side { min-height: 280px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>FQC Attention Monitor</h1>
        <span>Sleep detection · Eye direction · Looking-at-screen</span>
      </div>
      <div class="status-pill"><i class="dot" id="dot"></i><span id="sys">Connecting…</span></div>
    </header>

    <section class="stats">
      <div class="stat"><label>State</label><strong id="state">—</strong></div>
      <div class="stat"><label>EAR</label><strong id="ear">—</strong></div>
      <div class="stat"><label>PERCLOS</label><strong id="perclos">—</strong></div>
      <div class="stat"><label>Gaze</label><strong id="gaze">—</strong></div>
      <div class="stat"><label>Alerts</label><strong id="alertsCount">0</strong></div>
    </section>

    <section class="main">
      <div class="video-card">
        <div class="toolbar">
          <select id="videoSelect"></select>
          <button id="btnWebcam">Webcam</button>
          <label class="toggle"><input type="checkbox" id="ovLandmarks" checked /> Landmarks</label>
          <label class="toggle"><input type="checkbox" id="ovArrow" checked /> Gaze arrow</label>
          <label class="toggle"><input type="checkbox" id="ovHud" checked /> HUD</label>
          <button id="btnClear">Clear alerts</button>
        </div>
        <div class="feed">
          <img id="feed" src="/video_feed" alt="Live feed" />
        </div>
        <div class="metrics">
          <div><span>Looking at screen</span><b id="screenYes">—</b></div>
          <div><span>FPS</span><b id="fps">—</b></div>
          <div><span>Source</span><b id="source">—</b></div>
        </div>
      </div>

      <aside class="side">
        <div class="side-head">
          <h2>Cảnh báo</h2>
          <span style="color:var(--muted);font-size:12px" id="alertHint">realtime</span>
        </div>
        <div class="alerts" id="alertList"><div class="empty">Chưa có cảnh báo</div></div>
      </aside>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    async function loadVideos() {
      const r = await fetch('/api/videos');
      const data = await r.json();
      const sel = $('videoSelect');
      sel.innerHTML = '';
      (data.videos || []).forEach(v => {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        if (String(data.current).endsWith(v)) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    async function setSource(source) {
      await fetch('/api/source', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ source })
      });
      $('feed').src = '/video_feed?' + Date.now();
      loadVideos();
    }

    async function pushOverlays() {
      await fetch('/api/overlays', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          landmarks: $('ovLandmarks').checked,
          gaze_arrow: $('ovArrow').checked,
          hud: $('ovHud').checked,
        })
      });
    }

    function stateLabel(s) {
      if (s.asleep) return 'SLEEP';
      if (s.looking_away) return 'AWAY';
      if (s.tired) return 'TIRED';
      if (s.looking_at_screen) return 'ATTENTIVE';
      if (!s.face_detected) return 'NO FACE';
      return 'IDLE';
    }

    async function refreshStats() {
      try {
        const r = await fetch('/api/stats');
        if (!r.ok) throw new Error('offline');
        const s = await r.json();
        $('dot').classList.toggle('on', s.system === 'Online');
        $('sys').textContent = s.system === 'Online' ? `Online · ${s.fps || 0} FPS` : 'Offline';
        $('state').textContent = stateLabel(s);
        $('ear').textContent = s.ear == null ? '—' : s.ear.toFixed(3);
        $('perclos').textContent = ((s.perclos || 0) * 100).toFixed(1) + '%';
        $('gaze').textContent = s.gaze_direction || '—';
        $('alertsCount').textContent = s.total_alerts || 0;
        $('screenYes').textContent = s.looking_at_screen ? 'YES' : 'NO';
        $('fps').textContent = (s.fps || 0).toFixed(1);
        const src = String(s.source || '');
        $('source').textContent = src.split('/').pop() || src;
      } catch {
        $('dot').classList.remove('on');
        $('sys').textContent = 'Offline';
      }
    }

    async function refreshEvents() {
      try {
        const r = await fetch('/api/events?limit=40');
        const events = await r.json();
        const box = $('alertList');
        if (!events.length) {
          box.innerHTML = '<div class="empty">Chưa có cảnh báo</div>';
          return;
        }
        box.innerHTML = events.map(e => `
          <div class="alert">
            ${e.snapshot_path ? `<img src="${e.snapshot_path}" alt="" />` : '<div></div>'}
            <div class="meta">
              <div><span class="badge ${e.severity}">${e.severity}</span> <b>${e.event_type}</b></div>
              <div style="color:var(--muted);margin-top:4px">${e.message || ''}</div>
              <div style="color:var(--muted);margin-top:4px;font-size:11px">${e.created_at || ''}</div>
            </div>
          </div>
        `).join('');
      } catch {}
    }

    $('videoSelect').addEventListener('change', e => setSource(e.target.value));
    $('btnWebcam').addEventListener('click', () => setSource('webcam'));
    $('ovLandmarks').addEventListener('change', pushOverlays);
    $('ovArrow').addEventListener('change', pushOverlays);
    $('ovHud').addEventListener('change', pushOverlays);
    $('btnClear').addEventListener('click', async () => {
      await fetch('/api/events', { method: 'DELETE' });
      refreshEvents(); refreshStats();
    });

    loadVideos();
    refreshStats();
    refreshEvents();
    setInterval(refreshStats, 1000);
    setInterval(refreshEvents, 2500);
  </script>
</body>
</html>
